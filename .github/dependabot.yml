# Each entry has 1 group with `patterns: ["*"]`, so it opens at most 1
# version-update PR for each run (frostyard/core ADR-0075). Security
# updates stay ungrouped.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
